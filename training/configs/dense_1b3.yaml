# Jupiter Shot — 1.3B Dense Baseline Training Configuration
# Hardware target: 8× NVIDIA A100 80GB
# Framework: DeepSpeed ZeRO-2

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  config_name: "1.3b"
  vocab_size: 32000
  hidden_size: 2048
  num_layers: 24
  num_attention_heads: 16
  num_kv_heads: 16            # MHA (set to 8 for GQA)
  max_position_embeddings: 4096
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  intermediate_size: null     # auto: 2/3 × 4 × hidden_size = 5461 → 5632 (rounded)
  ffn_type: "swiglu"
  attention_dropout: 0.0
  hidden_dropout: 0.0
  tie_word_embeddings: true
  initializer_range: 0.02
  gradient_checkpointing: true  # Required for A100 memory budget

# ── Tokenizer ─────────────────────────────────────────────────────────────────
tokenizer:
  name_or_path: "gpt-neox"    # EleutherAI/gpt-neox-20b; Apache 2.0; no auth required
  max_length: 2048
  add_bos_token: false
  add_eos_token: true

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  seq_length: 2048
  shuffle_seed: 42
  buffer_size: 10000
  sources:
    - name: "redpajama_v1"
      hf_subset: "wikipedia"
      weight: 1.0
      text_field: "text"
      # max_documents: 10000   # Uncomment for smoke test

# ── Training ──────────────────────────────────────────────────────────────────
training:
  # Batch configuration
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  # Effective batch size = 4 × 8 × 8 GPUs = 256 sequences × 2048 tokens = 524,288 tokens/step

  # Optimization
  optimizer: "adamw"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  max_grad_norm: 1.0

  # LR schedule
  lr_scheduler: "cosine"
  warmup_steps: 2000
  min_lr_ratio: 0.1           # Final LR = 10% of peak LR

  # Training duration
  max_steps: 100000           # Gate C: ~50B tokens at 524K tokens/step
  # max_tokens: 500_000_000   # Alternative: stop after N tokens

  # Precision
  bf16: true
  fp16: false

  # Logging
  log_interval: 10
  eval_interval: 500
  save_interval: 1000

  # Checkpoint
  output_dir: "checkpoints/dense_1b3"
  keep_last_n_checkpoints: 3
  save_on_sigterm: true

# ── DeepSpeed ─────────────────────────────────────────────────────────────────
deepspeed:
  zero_stage: 2
  allgather_partitions: true
  reduce_scatter: true
  overlap_comm: true
  contiguous_gradients: true
  cpu_offload: false          # Keep optimizer on GPU for speed
  bf16:
    enabled: true

# ── Distributed ───────────────────────────────────────────────────────────────
distributed:
  backend: "nccl"
  num_gpus: 8
  num_nodes: 1

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  tasks:
    - "hellaswag"
    - "lambada_openai"
  num_fewshot: 0
  eval_batch_size: 8
