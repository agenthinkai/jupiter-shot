# Jupiter Shot — Dense Smoke Test Configuration
# Purpose: Gate A/B validation on 1-2 GPUs with synthetic or small real data
# Runtime: ~10 minutes on 1× A100 (Gate A), ~1 hour on 2× A100 (Gate B)

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  config_name: "125m"         # Use 125M model for smoke tests (not 1.3B)
  vocab_size: 32000
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  max_position_embeddings: 2048
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  ffn_type: "swiglu"
  attention_dropout: 0.0
  hidden_dropout: 0.0
  tie_word_embeddings: true
  gradient_checkpointing: false  # Not needed at 125M scale

# ── Tokenizer ─────────────────────────────────────────────────────────────────
tokenizer:
  name_or_path: "gpt-neox"
  max_length: 512
  add_bos_token: false
  add_eos_token: true

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  seq_length: 512
  shuffle_seed: 42
  buffer_size: 1000
  use_synthetic: true         # Use synthetic data for Gate A (no download required)
  synthetic_vocab_size: 32000
  synthetic_num_samples: 10000
  sources:
    - name: "redpajama_v1"
      hf_subset: "wikipedia"
      weight: 1.0
      text_field: "text"
      max_documents: 1000     # Only 1000 documents for smoke test

# ── Training ──────────────────────────────────────────────────────────────────
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2

  optimizer: "adamw"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  max_grad_norm: 1.0

  lr_scheduler: "cosine"
  warmup_steps: 100
  min_lr_ratio: 0.1

  max_steps: 500              # ~500 steps for smoke test
  bf16: true

  log_interval: 10
  eval_interval: 100
  save_interval: 100

  output_dir: "checkpoints/dense_smoke"
  keep_last_n_checkpoints: 2
  save_on_sigterm: true

# ── DeepSpeed ─────────────────────────────────────────────────────────────────
deepspeed:
  zero_stage: 2
  bf16:
    enabled: true

# ── Distributed ───────────────────────────────────────────────────────────────
distributed:
  backend: "nccl"
  num_gpus: 1                 # Gate A: 1 GPU; change to 2 for Gate B
  num_nodes: 1
