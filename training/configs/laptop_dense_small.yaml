# Jupiter Shot — Laptop Dense Small Config
# Target hardware: 6–8 GB VRAM
#   Tested: RTX 5060 Laptop GPU (8,151 MiB, Blackwell sm_120)
#   Also suitable: RTX 3060 6GB, RTX 2070 8GB, RTX 3070 8GB
# Gradient checkpointing: required for 8 GB VRAM
# Effective VRAM budget: ~5.5 GB (after 1.5 GB Windows/CUDA overhead)
#
# RTX 50-series / Blackwell (sm_120) notes:
#   - Requires PyTorch 2.7.1+cu128 (NOT 2.2.2+cu121)
#   - BF16 is natively supported and preferred over FP16 on Blackwell
#   - The run_all_laptop_validation.bat script enforces this config for 8 GB VRAM
#   - Maximum steps for 8 GB: 10 diagnostic + 100 full validation
#   - The 1.3B model is NOT attempted on 8 GB VRAM
#
# ── Tokenizer contract ────────────────────────────────────────────────────────
#   tokenizer_id:    EleutherAI/gpt-neox-20b  (Apache 2.0)
#   vocab_size:      50,277
#   Runtime guard:   model_config.vocab_size >= len(tokenizer)
#                    input_ids.max() < model_config.vocab_size
#   Halt code:       TOKENIZER_VOCABULARY_MISMATCH
#
# ── Parameter counts (vocab=50277, hidden=512, layers=8, intermediate=1408) ──
#   Token embedding:       50277 × 512 = 25.74 M
#   Positional embedding:    512 × 512 =  0.26 M
#   Attention (8 layers):  8 × 4 × 512² = 8.39 M
#   FFN SwiGLU (8 layers): 8 × 3 × 512 × 1408 = 17.30 M
#   LayerNorm (8 layers):  8 × 4 × 512 = 0.02 M
#   LM head (tied):        0
#   ─────────────────────────────────────────────────────────────
#   Total parameters:      51,710,464  (~51.7 M)
#
# ── VRAM estimate (BF16, batch=2, seq=512, gradient_checkpointing=true) ──────
#   Weights (BF16):        0.103 GB  (51.7M × 2 bytes)
#   Gradients (BF16):      0.103 GB
#   Optimizer (AdamW fp32):0.414 GB  (51.7M × 2 states × 4 bytes)
#   Activations (grad-ckpt):0.025 GB
#   ─────────────────────────────────────────────────────────────
#   Estimated peak:        ~0.65 GB  (NOT verified on hardware)
#   Target (< 80% of 8,151 MiB): 6.50 GB  — well within budget
#
# ── Dataset license note ──────────────────────────────────────────────────────
#   Hugging Face metadata lists CC BY-SA 3.0 and GFDL.
#   Dataset card text states CC BY-SA 4.0.
#   Use for technical validation only pending final governance review.

model:
  vocab_size: 50277          # EleutherAI/gpt-neox-20b tokenizer (50,277 tokens)
  hidden_size: 512
  num_hidden_layers: 8
  num_attention_heads: 8
  # intermediate_size = SwiGLU: 2/3 * 4 * hidden_size, rounded to 64
  # 2/3 * 4 * 512 = 1365 → round to 1408
  intermediate_size: 1408
  max_position_embeddings: 512
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seq_length: 512
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  # Use bf16 on Blackwell (sm_120) / Ampere+; fp16 on older GPUs.
  # The validation script selects precision automatically via the preflight.
  precision: bf16  # bf16 preferred on RTX 50-series; change to fp16 for pre-Ampere GPUs
  gradient_checkpointing: true

metadata:
  tier: "6-8GB"
  # Tokenizer contract
  tokenizer_id: "EleutherAI/gpt-neox-20b"   # Apache 2.0, vocab=50277
  tokenizer_vocab_size: 50277
  # vocab_size MUST be >= tokenizer_vocab_size at runtime (enforced by runner)
  # Parameter counts (vocab=50277, hidden=512, layers=8, intermediate=1408)
  param_count_total: 51710464
  param_count_approx_m: 51.7
  # VRAM estimate (BF16, batch=2, seq=512, gradient_checkpointing=true)
  weight_memory_gb: 0.103
  estimated_peak_vram_gb: 0.65
  vram_estimate_verified: false   # pending hardware measurement
  vram_budget_gb: 5.5
  blackwell_compatible: true
  min_pytorch_version: "2.7.1+cu128"  # Required for sm_120 (Blackwell)
  # Dataset identity
  dataset_id: "Salesforce/wikitext"
  dataset_config: "wikitext-2-raw-v1"
  dataset_split: "train"
  dataset_license_note: >
    Hugging Face metadata lists CC BY-SA 3.0 and GFDL.
    Dataset card text states CC BY-SA 4.0.
    Use for technical validation only pending final governance review.
  notes: >
    Standard small validation config. Required config for RTX 5060 Laptop GPU
    (8 GB VRAM, Blackwell sm_120). Also suitable for most gaming laptops with
    6-8 GB VRAM. Gradient checkpointing is required for 8 GB VRAM.
