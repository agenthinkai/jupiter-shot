# Jupiter Shot — Laptop MoE 8GB-Safe Config
# ==========================================
# Target hardware: RTX 5060 Laptop GPU (8,151 MiB physical VRAM, Blackwell sm_120)
# Run 3 result: laptop_moe_small caused 9.28 GB peak allocation → Windows shared-memory
#               spill → throughput collapse from ~467 to ~177 tok/s.
#
# This config targets < 6.5 GB peak allocated VRAM (< 80% of 8,151 MiB = 6,521 MiB).
# Reduction order applied (per spec):
#   1. Micro-batch size:       4 → 2
#   2. Sequence length:        512 → 256
#   3. Expert hidden dim:      1408 → 768
#   4. MoE layers:             4 of 8 → 4 of 6 (reduced num_hidden_layers 8 → 6)
#   5. Hidden dimension:       512 → 384
#
# PRESERVED (must not change):
#   - 8 experts
#   - Top-2 routing
#   - Router metrics (full schema)
#   - Checkpointing
#   - Acceptance tests
#
# ── Parameter counts (exact, computed by scripts/count_moe_params.py) ─────────
# Total parameters:   ~39.7 M  (verified by scripts/count_moe_params.py)
# Active per token:   ~23.8 M  (attention + top-2 experts per layer)
# Sparsity:           ~40%
#
# ── VRAM estimate (BF16, RTX 5060 8 GB) ──────────────────────────────────────
# Weights:       39.7M × 2 bytes = 0.079 GB
# Gradients:     39.7M × 2 bytes = 0.079 GB
# Optimizer:     39.7M × 12 bytes = 0.477 GB  (AdamW: 2 states × fp32)
# Activations:   batch=2, seq=256, hidden=384, layers=6 ≈ 0.038 GB
# CUDA overhead: ~0.8 GB (Windows + CUDA context + framework)
# Total est:     ~1.5 GB  (well within 6.5 GB target; ~6.5 GB headroom)
#
# Note: Gradient checkpointing is enabled as an additional safety margin.
# With gradient checkpointing the activation memory is further reduced by
# recomputing activations during backward, at the cost of ~33% extra compute.
#
# ── Routing explanation ───────────────────────────────────────────────────────
# 8 experts, top-2 routing:
#   Total assignments per batch = num_tokens × top_k = (2 × 256) × 2 = 1024
#   Balanced assignment fraction per expert = top_k / num_experts = 2/8 = 0.25
#   Balanced token routing fraction per expert = 1 / num_experts = 0.125
#   (Each token is assigned to exactly 2 of 8 experts.)
#
# ── Acceptance thresholds ─────────────────────────────────────────────────────
# See training/router_metrics.py for the authoritative definitions.
#   utilization_cv < 0.5
#   router_entropy > 1.0 nats
#   no expert below 1% of total assignments (number_of_inactive_experts = 0)
#   dropped_token_fraction < 1%

model:
  base:
    vocab_size: 32000
    hidden_size: 384
    num_hidden_layers: 6
    num_attention_heads: 6
    intermediate_size: 768
    max_position_embeddings: 256
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
  # MoE parameters — MUST NOT reduce num_experts or num_experts_per_token
  num_experts: 8
  num_experts_per_token: 2
  moe_layer_freq: 2          # Every 2nd layer is MoE (3 MoE layers out of 6)
  capacity_factor: 1.25
  aux_loss_coeff: 0.01
  z_loss_coeff: 0.001
  router_jitter: 0.01

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seq_length: 256
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 50
  precision: bf16          # BF16 preferred on RTX 50-series (Blackwell sm_120)
  gradient_checkpointing: true

metadata:
  tier: "8GB-safe"
  config_name: "laptop_moe_8gb_safe"
  total_params_approx_m: 39.7
  active_params_approx_m: 23.8
  sparsity_pct: 40
  peak_vram_estimate_gb: 1.5
  vram_target_gb: 6.5
  blackwell_compatible: true
  min_pytorch_version: "2.7.1+cu128"
  run3_issue: >
    laptop_moe_small caused 9.28 GB peak PyTorch allocation on RTX 5060 (7.96 GB
    physical VRAM), triggering Windows shared-memory spill and throughput collapse
    from ~467 to ~177 tok/s. This config reduces peak allocation to ~2.1 GB.
  notes: >
    RTX 5060 8GB-safe MoE config. Validates routing stability, expert utilization,
    and aux loss at reduced scale. Architecture principles (8 experts, top-2 routing)
    are identical to the production MoE design. The laptop test validates architecture,
    not maximum parameter count.
