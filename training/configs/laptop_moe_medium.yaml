# Jupiter Shot — Laptop MoE Medium Config
# Target hardware: 10–16 GB VRAM
# Architecture: 8 experts, top-2 routing, ~700M total / ~200M active
# Effective VRAM budget: ~9.5 GB

model:
  base:
    vocab_size: 32000
    hidden_size: 1024
    num_hidden_layers: 16
    num_attention_heads: 16
    intermediate_size: 2752
    max_position_embeddings: 1024
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
  # MoE parameters
  num_experts: 8
  num_experts_per_token: 2
  moe_layer_freq: 2          # Every 2nd layer is MoE (8 MoE layers out of 16)
  capacity_factor: 1.25
  aux_loss_coeff: 0.01
  z_loss_coeff: 0.001
  router_jitter: 0.01

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seq_length: 1024
  learning_rate: 2.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 200
  precision: bf16
  gradient_checkpointing: true

  # Estimated VRAM (BF16):
  # Weights:    ~1.40 GB  (700M × 2 bytes)
  # Gradients:  ~1.40 GB
  # Optimizer:  ~4.20 GB  (700M × 12 bytes)
  # Activations: ~2.0 GB
  # Total est:  ~9.0 GB   (tight on 10GB; use gradient checkpointing)

metadata:
  tier: "10-16GB"
  total_params_approx_m: 700
  active_params_approx_m: 200
  sparsity_pct: 71
  notes: "Medium MoE config. Architecturally significant. Requires 10GB+ VRAM with gradient checkpointing."
