#   max_pos:       256
#   num_experts:   8
#   top_k:         2
#
# ── Parameter count (programmatically verified) ───────────────────────────────
#
#   Embedding (tied):    50,277 × 384          = 19,306,368
#   Per-layer:
#     Attention (Q+K+V+O): 4 × 384²            = 589,824
#     Router gate:          384 × 8             = 3,072
#     Expert FFN (×8):      (2×384×768 + 768×384) × 8
#                         = 884,736 × 8         = 7,077,888
#     2×RMSNorm:            2 × 384             = 768
#     Per-layer total:                          = 7,671,552
#   6 layers:            7,671,552 × 6          = 46,029,312
#   Final RMSNorm:       384
#   LM head (tied):      0
#   ─────────────────────────────────────────────────────
#   TOTAL:               65,336,064            ≈ 65.34M
#
#   Active params per token (top-2 routing):
#     Embedding + (attn + router + 2×expert_ffn + norm) × 6 + final_norm
#     = 19,306,368 + (589,824 + 3,072 + 1,769,472 + 768) × 6 + 384
#     = 19,306,368 + 14,178,816 + 384
#     = 33,485,568                             ≈ 33.49M
#
#   Sparsity: (1 - 33.49/65.34) × 100 ≈ 48.7%
#
#   NOTE: These counts are computed from the config fields above.
#   The pipeline will construct the actual model and verify the count
#   against this expected value (±1% tolerance).
#
# ── VRAM estimate (NOT verified on hardware) ─────────────────────────────────
#
#   Weights (BF16):      65.34M × 2 bytes       = 0.131 GB
#   Gradients (BF16):    65.34M × 2 bytes       = 0.131 GB
#   Optimizer (AdamW):   65.34M × 2 × 4 bytes   = 0.523 GB
#   Activations:         batch=2, seq=256        ≈ 0.030 GB
#   ─────────────────────────────────────────────────────
#   ESTIMATED PEAK:      ~0.82 GB   NOT verified on hardware
#   Target (< 6.5 GB):  6.50 GB    Margin: ~5.68 GB
#
# ── Routing explanation ───────────────────────────────────────────────────────
#
#   8 experts, top-2 routing:
#     Balanced assignment fraction per expert = top_k / num_experts = 2/8 = 0.250
#       → Each expert should receive ~25.0% of all expert assignments
#     Balanced token routing fraction per expert = 1 / num_experts = 1/8 = 0.125
#       → Each expert should be visited by ~12.5% of all tokens
#
# ── Tokenizer contract ────────────────────────────────────────────────────────
#
#   tokenizer_id:  EleutherAI/gpt-neox-20b
#   vocab_size:    50,277
#   license:       Apache 2.0

model:
  base:
    # ── All keys use CANONICAL DenseConfig field names ──
    vocab_size: 50277
    hidden_size: 384
    num_layers: 6                  # canonical name (NOT num_hidden_layers)
    num_attention_heads: 6
    intermediate_size: 768
    max_position_embeddings: 256
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
    gradient_checkpointing: true
    attention_dropout: 0.0
    hidden_dropout: 0.0

  # ── MoE parameters — CANONICAL field names ──
  num_experts: 8
  num_experts_per_token: 2
  expert_capacity_factor: 1.25    # canonical (NOT capacity_factor)
  router_aux_loss_coeff: 0.01     # canonical (NOT aux_loss_coeff)
  router_z_loss_coeff: 0.001      # canonical (NOT z_loss_coeff)
  normalize_router_probs: true
  use_shared_expert: false
  expert_dropout: 0.0

  # Unsupported keys intentionally omitted (see docs/CONFIG_CONTRACT_AUDIT.md).

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seq_length: 256
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 50
  precision: bf16
  gradient_checkpointing: true

metadata:
  run: "run7"
  config_name: "laptop_moe_run7"
  config_version: "7.0"
  strict_loader: true              # loaded by training/config_loader.py
  # Tokenizer
  tokenizer_id: "EleutherAI/gpt-neox-20b"
  tokenizer_vocab_size: 50277
  tokenizer_license: "Apache 2.0"
  # MoE topology
  num_experts: 8
  num_experts_per_token: 2
  # Parameter counts (programmatically computed from config fields above)
  total_params: 65336064
  total_params_approx_m: 65.34
  active_params_per_token: 33485568
  active_params_approx_m: 33.49
  sparsity_pct: 48.7
  params_verified_by: "scripts/run_laptop_validation_pipeline.py"
  params_tolerance_pct: 1.0
  # VRAM estimates — NOT verified on hardware
