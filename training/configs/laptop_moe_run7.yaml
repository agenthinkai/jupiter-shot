#
# ── Architecture ──────────────────────────────────────────────────────────────
#
#   vocab_size:    50,277  (EleutherAI/gpt-neox-20b tokenizer, Apache 2.0)
#   hidden_size:   384
#   num_layers:    6       ← CANONICAL field name (not num_hidden_layers)
