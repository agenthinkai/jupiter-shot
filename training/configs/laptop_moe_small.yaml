# Jupiter Shot — Laptop MoE Small Config
# Target hardware: 6–8 GB VRAM
#   Tested: RTX 5060 Laptop GPU (8,151 MiB, Blackwell sm_120)
#   Also suitable: RTX 3060 6GB, RTX 2070 8GB, RTX 3070 8GB
# Architecture: 8 experts, top-2 routing, ~180M total / ~55M active
# Effective VRAM budget: ~5.5 GB
#
# RTX 50-series / Blackwell (sm_120) notes:
#   - Requires PyTorch 2.7.1+cu128 (NOT 2.2.2+cu121)
#   - BF16 is natively supported and preferred over FP16 on Blackwell
#   - The run_all_laptop_validation.bat script enforces this config for 8 GB VRAM
#   - Maximum steps for 8 GB: 10 diagnostic + 100 full validation

model:
  base:
    vocab_size: 32000
    hidden_size: 512
    num_hidden_layers: 8
    num_attention_heads: 8
    intermediate_size: 1408
    max_position_embeddings: 512
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
  # MoE parameters
  num_experts: 8
  num_experts_per_token: 2
  moe_layer_freq: 2          # Every 2nd layer is MoE (4 MoE layers out of 8)
  capacity_factor: 1.25
  aux_loss_coeff: 0.01
  z_loss_coeff: 0.001
  router_jitter: 0.01

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seq_length: 512
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 100
  # Use bf16 on Blackwell (sm_120) / Ampere+; fp16 on older GPUs.
  # The validation script selects precision automatically via the preflight.
  precision: bf16  # bf16 preferred on RTX 50-series; change to fp16 for pre-Ampere GPUs
  gradient_checkpointing: true

  # Estimated VRAM (BF16, RTX 5060 8 GB):
  # Weights:    ~0.36 GB  (180M × 2 bytes)
  # Gradients:  ~0.36 GB
  # Optimizer:  ~1.08 GB  (180M × 12 bytes)
  # Activations: ~1.0 GB
  # Total est:  ~2.8 GB   (within 5.5 GB budget; ~2.7 GB headroom on 8 GB VRAM)

metadata:
  tier: "6-8GB"
  total_params_approx_m: 180
  active_params_approx_m: 55
  sparsity_pct: 69
  blackwell_compatible: true
  min_pytorch_version: "2.7.1+cu128"  # Required for sm_120 (Blackwell)
  notes: >
    Standard MoE validation config. Tests routing stability and expert utilization
    at meaningful scale. Required config for RTX 5060 Laptop GPU (8 GB VRAM,
    Blackwell sm_120). Gradient checkpointing is required for 8 GB VRAM.
