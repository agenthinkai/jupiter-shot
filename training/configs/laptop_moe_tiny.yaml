# Jupiter Shot — Laptop MoE Tiny Config
# Target hardware: 4 GB VRAM
# Architecture: 8 experts, top-2 routing, ~40M total / ~12M active
# Effective VRAM budget: ~2.5 GB

model:
  base:
    vocab_size: 32000
    hidden_size: 256
    num_hidden_layers: 4
    num_attention_heads: 8
    intermediate_size: 704
    max_position_embeddings: 256
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
  # MoE parameters
  num_experts: 8
  num_experts_per_token: 2
  moe_layer_freq: 2          # Every 2nd layer is MoE (2 MoE layers out of 4)
  capacity_factor: 1.25
  aux_loss_coeff: 0.01
  z_loss_coeff: 0.001
  router_jitter: 0.01

training:
  batch_size: 2
  gradient_accumulation_steps: 4
  seq_length: 256
  learning_rate: 5.0e-4
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_steps: 50
  precision: fp16
  gradient_checkpointing: true

  # Active params per token ≈ non-expert + (2/8) × expert params ≈ 12M
  # Total params ≈ 40M

metadata:
  tier: "4GB"
  total_params_approx_m: 40
  active_params_approx_m: 12
  sparsity_pct: 70
  notes: "Minimal MoE architectural validation. Tests routing stability on very small scale."
