# Jupiter Shot — MoE Prototype Training Configuration
# Hardware target: 8× NVIDIA A100 80GB
# Model: ~1B–3B total params, ~300M–700M active params per token

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  type: "moe"
  config_name: "moe_1b"

  # Base transformer
  vocab_size: 32000
  hidden_size: 1024
  num_layers: 12
  num_attention_heads: 8
  max_position_embeddings: 2048
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  ffn_type: "swiglu"
  attention_dropout: 0.0
  tie_word_embeddings: true
  gradient_checkpointing: true

  # MoE-specific
  num_experts: 8
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  router_aux_loss_coeff: 0.01
  router_z_loss_coeff: 0.001
  use_shared_expert: false
  expert_dropout: 0.0
  normalize_router_probs: true

# ── Tokenizer ─────────────────────────────────────────────────────────────────
tokenizer:
  name_or_path: "gpt-neox"
  max_length: 2048
  add_bos_token: false
  add_eos_token: true

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  seq_length: 2048
  shuffle_seed: 42
  buffer_size: 10000
  sources:
    - name: "redpajama_v1"
      hf_subset: "wikipedia"
      weight: 1.0
      text_field: "text"

# ── Training ──────────────────────────────────────────────────────────────────
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8

  optimizer: "adamw"
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  max_grad_norm: 1.0

  lr_scheduler: "cosine"
  warmup_steps: 2000
  min_lr_ratio: 0.1

  max_steps: 50000
  bf16: true

  log_interval: 10
  eval_interval: 500
  save_interval: 1000

  output_dir: "checkpoints/moe_prototype"
  keep_last_n_checkpoints: 3
  save_on_sigterm: true

  # MoE-specific logging
  log_router_metrics: true
  router_metrics_interval: 100

# ── DeepSpeed ─────────────────────────────────────────────────────────────────
deepspeed:
  zero_stage: 2
  bf16:
    enabled: true

# ── Distributed ───────────────────────────────────────────────────────────────
distributed:
  backend: "nccl"
  num_gpus: 8
  num_nodes: 1
